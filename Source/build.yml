name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DoesitSampler-VST3
          path: build/DoesitSampler_artefacts/Release/VST3/
